# Checks for this repository's own code: lint the workflow, scripts and Dockerfile,
# and run the tests. Nothing is built for real or published here.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install linters
        run: pip install actionlint-py zizmor hadolint-py

      - name: actionlint (workflow syntax and expressions)
        run: actionlint .github/workflows/*.yml

      - name: zizmor (workflow security audit)
        run: zizmor --offline .github/workflows/

      - name: ShellCheck (scripts)
        run: shellcheck scripts/*.sh tests/mocks/* tests/integration/*.sh

      - name: Hadolint (Dockerfile)
        run: hadolint Dockerfile

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      # Two empty registries for the integration test.
      source:
        image: registry:3
        ports:
          - 5001:5000
      dest:
        image: registry:3
        ports:
          - 5002:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: App tests and workflow policy tests
        run: |
          pip install pytest pyyaml
          python -m pytest -q tests/

      - name: Script tests (bats, fake Trivy)
        run: |
          sudo apt-get update && sudo apt-get install -y bats
          bats tests/scripts.bats

      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
        with:
          version: v0.22.1

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Integration test (real crane + cosign + two local registries)
        run: tests/integration/local-registry-test.sh
