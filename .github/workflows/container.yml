# Build a multi-arch image -> scan it with Trivy -> (protected branches only) push it to
# ECR / ACR / Google Artifact Registry -> sign it with Cosign -> verify the signature.
#
# Every registry is optional: it is used only when its repository variables are set
# (Settings > Secrets and variables > Actions > Variables). No passwords are stored: AWS, Azure,
# Google and Cosign all use GitHub's OIDC token.
#
# Every action is pinned to a full commit SHA (the comment shows the version). Tags can be moved
# by an attacker; a SHA cannot. Dependabot (.github/dependabot.yml) proposes updates.

name: container

on:
  pull_request:
  push:
    branches: [main, "release/**"]
  workflow_dispatch:

# Nothing by default. Each job asks only for what it needs.
permissions: {}

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ${{ vars.IMAGE_NAME || 'yefter-demo-app' }}
  PLATFORMS: ${{ vars.PLATFORMS || 'linux/amd64,linux/arm64' }}
  TRIVY_SEVERITY: ${{ vars.TRIVY_SEVERITY || 'CRITICAL,HIGH' }}
  # Tool versions are pinned here on purpose (reviewed in pull requests, not changed by a setting).
  COSIGN_VERSION: v3.1.4
  CRANE_VERSION: v0.22.1
  # A throw-away registry that lives only inside the job (see "services" below).
  LOCAL_REGISTRY: localhost:5000

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Run the app's tests
        run: |
          pip install pytest
          python -m pytest -q tests/test_app.py

  image:
    name: Build, scan, publish, sign
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write         # OIDC: cloud logins and keyless Cosign signing (only used when publishing)
      security-events: write  # upload Trivy results to the Security tab

    services:
      registry:
        # Tip: pin this by digest too (registry:3@sha256:...) once you have looked it up with
        # "docker buildx imagetools inspect registry:3". It never leaves the job, and holds no secrets.
        image: registry:3
        ports:
          - 5000:5000

    env:
      # Keyless signing: the signature must come from THIS workflow file on THIS branch.
      CERT_IDENTITY: https://github.com/${{ github.workflow_ref }}
      OIDC_ISSUER: https://token.actions.githubusercontent.com

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ---------------------------------------------------------------- 1. decide
      - name: Should this run publish?
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          if { [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; } &&
             [ "$REF_TYPE" = "branch" ] && [ "$REF_PROTECTED" = "true" ]; then
            echo "publish=true" >>"$GITHUB_OUTPUT"
            echo "Will publish: '$REF_NAME' is a protected branch."
          else
            echo "publish=false" >>"$GITHUB_OUTPUT"
            echo "Will NOT publish: event=$EVENT_NAME ref=$REF_NAME protected=$REF_PROTECTED (build and scan only)."
          fi

      - name: Work out the image tags
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MUTABLE_TAGS: ${{ vars.MUTABLE_TAGS || 'true' }}
        run: |
          {
            echo "TAGS<<TAGS_END"
            scripts/image-tags.sh
            echo "TAGS_END"
          } >>"$GITHUB_ENV"

      # ---------------------------------------------------------------- 2. build (multi-arch)
      - name: Set up QEMU (lets an amd64 runner build arm64)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host   # so the builder can reach the local registry
          buildkitd-config-inline: |
            [registry."localhost:5000"]
              http = true
              insecure = true

      - name: Build for every platform and push to the local registry
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ env.LOCAL_REGISTRY }}/${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max   # how it was built (SLSA provenance), stored next to the image
          sbom: true             # what is inside (SBOM), stored next to the image

      - name: Remember the exact image that was built
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "SOURCE_REF=$LOCAL_REGISTRY/$IMAGE_NAME@$DIGEST" >>"$GITHUB_ENV"
          echo "Built $LOCAL_REGISTRY/$IMAGE_NAME@$DIGEST for $PLATFORMS"

      # ---------------------------------------------------------------- 3. scan
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.1   # pinned: Trivy had a supply-chain attack in March 2026 (v0.69.4)

      - name: Scan every platform with Trivy
        env:
          TRIVY_INSECURE: "true"   # the local registry speaks plain http
        run: scripts/scan-image.sh "$SOURCE_REF"

      - name: Upload scan results to the Security tab
        if: >-
          always() && hashFiles('trivy-results.sarif') != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      # ---------------------------------------------------------------- 4. publish + sign
      # Everything below runs ONLY when the gate said yes, and only after the scan passed.
      - name: Check that at least one registry is configured
        if: steps.gate.outputs.publish == 'true' && vars.ECR_REPOSITORY == '' && vars.ACR_NAME == '' && vars.GAR_REPOSITORY == ''
        run: |
          echo "::error::Nothing to publish to. Set ECR_REPOSITORY, ACR_NAME and/or GAR_REPOSITORY (see README)."
          exit 1

      - name: Install crane (copies images between registries without changing them)
        if: steps.gate.outputs.publish == 'true'
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
        with:
          version: ${{ env.CRANE_VERSION }}

      - name: Install Cosign
        if: steps.gate.outputs.publish == 'true'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Start the summary table
        if: steps.gate.outputs.publish == 'true'
        run: |
          {
            echo "### Published images"
            echo "| Repository | Digest | Tags | Signature |"
            echo "|---|---|---|---|"
          } >>"$GITHUB_STEP_SUMMARY"

      # ---- Amazon ECR
      - name: "ECR: log in to AWS (OIDC)"
        if: steps.gate.outputs.publish == 'true' && vars.ECR_REPOSITORY != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: "ECR: log in to the registry"
        id: ecr
        if: steps.gate.outputs.publish == 'true' && vars.ECR_REPOSITORY != ''
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: "ECR: publish and sign"
        if: steps.gate.outputs.publish == 'true' && vars.ECR_REPOSITORY != ''
        env:
          DEST: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}
        run: scripts/release.sh "$DEST"

      # ---- Azure Container Registry
      - name: "ACR: log in to Azure (OIDC)"
        if: steps.gate.outputs.publish == 'true' && vars.ACR_NAME != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: "ACR: log in to the registry, publish and sign"
        if: steps.gate.outputs.publish == 'true' && vars.ACR_NAME != ''
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: |
          az acr login --name "$ACR_NAME"
          login_server="$(az acr show --name "$ACR_NAME" --query loginServer --output tsv)"
          scripts/release.sh "$login_server/$IMAGE_NAME"

      # ---- Google Artifact Registry (the successor of gcr.io)
      - name: "GAR: log in to Google Cloud (OIDC)"
        id: gcp
        if: steps.gate.outputs.publish == 'true' && vars.GAR_REPOSITORY != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: "GAR: log in to the registry"
        if: steps.gate.outputs.publish == 'true' && vars.GAR_REPOSITORY != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ vars.GAR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp.outputs.access_token }}

      - name: "GAR: publish and sign"
        if: steps.gate.outputs.publish == 'true' && vars.GAR_REPOSITORY != ''
        env:
          GAR_PATH: ${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}
        run: scripts/release.sh "$GAR_PATH/$IMAGE_NAME"

      # ---------------------------------------------------------------- 5. report
      - name: Summary
        if: always()
        env:
          PUBLISH: ${{ steps.gate.outputs.publish }}
        run: |
          {
            echo "### Build"
            echo "- Image: \`${SOURCE_REF:-not built}\`"
            echo "- Platforms: \`$PLATFORMS\`, Trivy severity gate: \`$TRIVY_SEVERITY\`"
            echo "- Published: **$PUBLISH**"
            if [ "$PUBLISH" = "true" ]; then
              echo ""
              echo "Verify a signature yourself:"
              echo '```'
              echo "cosign verify <repository>@<digest> \\"
              echo "  --certificate-identity '$CERT_IDENTITY' \\"
              echo "  --certificate-oidc-issuer '$OIDC_ISSUER'"
              echo '```'
            fi
          } >>"$GITHUB_STEP_SUMMARY"
